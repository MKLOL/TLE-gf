<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>TLE Games import</title><link rel="stylesheet" href="style.css"></head>
<body>
  <header><div><span class="eyebrow">TLE · GAMES</span><h1>Post your game results.</h1></div><button id="settings" class="secondary small">Settings</button></header>
  <p id="connection" class="muted">Connect your Discord server to get started.</p>
  <p id="status" role="status" aria-live="polite"></p>
  <p id="wait-note" class="muted" role="status" hidden></p>
  <section id="preview" hidden>
    <h2 id="title"></h2>
    <p id="summary" class="muted"></p>
    <p class="muted">Review every player and Discord match in a larger window. Nothing is imported until you confirm there.</p>
    <div class="actions"><button id="open-review">Review matches…</button><button id="cancel" class="secondary">Discard preview</button></div>
  </section>
  <section id="read-tools">
  <label for="date">Puzzle date</label><input id="date" type="date" readonly>
  <p class="muted">The leaderboard’s puzzle number sets the date automatically, following LinkedIn’s Pacific calendar.</p>
  <div class="actions"><button id="own">Read my LinkedIn score</button><button id="read" class="secondary">Read leaderboard</button></div>
  <p id="linkedin-status" class="muted"></p>
  <p id="akari-status" class="muted"></p>
  <section id="own-preview" hidden><p id="own-summary"></p><div class="actions"><button id="post-own">Post my score</button><button id="cancel-own" class="secondary">Cancel</button></div></section>
  </section>
  <script type="module" src="personal.js"></script>
  <script type="module" src="popup.js"></script>
</body>
</html>
